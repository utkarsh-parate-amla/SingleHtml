<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #f1f5f9;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 2.5rem;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .card h1 {
    margin: 0 0 1.5rem;
    font-size: 1.5rem;
    text-align: center;
  }
  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 0.4rem;
    color: #94a3b8;
  }
  input {
    width: 100%;
    padding: 0.65rem 0.75rem;
    margin-bottom: 1.1rem;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 0.95rem;
  }
  input:focus {
    outline: none;
    border-color: #38bdf8;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    border: none;
    border-radius: 6px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: #0ea5e9;
  }
  .footer {
    margin-top: 1.25rem;
    text-align: center;
    font-size: 0.8rem;
    color: #64748b;
  }
  .footer a {
    color: #38bdf8;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Sign In</h1>
    <form onsubmit="event.preventDefault(); alert('Demo only — no backend connected.');">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>

      <button type="submit">Log In</button>
    </form>
    <div class="footer">Deployed with <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer">Vercel</a></div>
  </div>
</body>
</html>
